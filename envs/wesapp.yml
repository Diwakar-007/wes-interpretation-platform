# Python environment for the interpretation engine (and later the web app).
# Create with: mamba env create -f envs/wesapp.yml && conda activate wesapp && pip install -e interpretation
name: wesapp
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - cyvcf2        # fast VCF parsing (htslib based)
  - pytest
  - pip
  # reporting
  - jinja2                 # HTML templates
  - weasyprint             # HTML/CSS -> PDF
  - fonts-conda-ecosystem  # fonts for PDF rendering inside the env
